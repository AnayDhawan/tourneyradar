name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # Typecheck rather than `next build`: the build imports lib/supabase.ts,
      # which throws without NEXT_PUBLIC_SUPABASE_* env vars, and those secrets
      # are not exposed to Dependabot-triggered runs. `tsc --noEmit` needs no
      # env at all, so it gates dependency bumps too. The full build is still
      # exercised by the Vercel preview deployment on every PR.
      - run: npm run typecheck
